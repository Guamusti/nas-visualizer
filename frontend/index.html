<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAS Visualizer</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<!-- Top bar -->
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">◉</span>
    <span class="brand-name">Fototeca</span>
    <span class="brand-host" id="nasHost">—</span>
  </div>

  <nav class="viewtabs">
    <button class="tab active" data-view="albums" id="tabAlbums">Álbumes</button>
    <button class="tab" data-view="all" id="tabAll">Todas</button>
    <button class="tab" data-view="reels" id="tabReels">Reels</button>
  </nav>

  <div class="topbar-actions">
    <span class="conn" id="connBadge"><i class="dot"></i><span id="connText">…</span></span>
    <button class="btn btn-primary" id="indexBtn">Indexar</button>
  </div>
</header>

<!-- Index progress -->
<div class="index-panel" id="indexPanel" hidden>
  <div class="index-head">
    <span id="indexPhase">Indexando…</span>
    <span class="muted" id="indexCounts"></span>
  </div>
  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
  <div class="index-file muted" id="indexFile"></div>
</div>

<!-- ALBUMS VIEW -->
<main class="view" id="albumsView">
  <div class="page-head">
    <div>
      <p class="eyebrow">Tu biblioteca</p>
      <h1 class="page-title" id="albumsTitle">Álbumes</h1>
    </div>
    <div class="albums-toggle" id="albumsMode">
      <button class="seg active" data-by="auto">Automático</button>
      <button class="seg" data-by="country">Por país</button>
      <button class="seg" data-by="folder">Por carpeta</button>
    </div>
  </div>
  <div class="album-grid" id="albumGrid"></div>
  <div class="empty" id="albumsEmpty" hidden>
    <div class="empty-mark">◍</div>
    <h2>Aún no hay fotos indexadas</h2>
    <p>Pulsa <strong>Indexar</strong> para escanear tus fotos del NAS.</p>
  </div>
</main>

<!-- PHOTOS VIEW (album detail or all) -->
<main class="view" id="photosView" hidden>
  <header class="album-hero" id="albumHero">
    <button class="back" id="backBtn">‹ Álbumes</button>
    <div class="hero-body">
      <span class="hero-flag" id="heroFlag"></span>
      <div>
        <p class="eyebrow" id="heroEyebrow">Álbum</p>
        <h1 class="hero-title" id="heroTitle">Todas las fotos</h1>
        <p class="hero-meta" id="heroMeta"></p>
      </div>
      <div class="hero-actions">
        <button class="btn btn-ghost" id="tagCountryBtn" hidden>🏳 Asignar país</button>
        <select id="sortSelect" class="select">
          <option value="taken_desc">Más recientes</option>
          <option value="taken_asc">Más antiguas</option>
          <option value="name">Por nombre</option>
        </select>
      </div>
    </div>
  </header>

  <div class="photo-grid" id="grid"></div>
  <div class="sentinel" id="sentinel"></div>
  <div class="grid-status muted" id="gridStatus"></div>
</main>

<!-- REELS VIEW -->
<main class="reels-view" id="reelsView" hidden>
  <header class="reels-head">
    <div>
      <p class="eyebrow">Momentos</p>
      <h1>Reels</h1>
    </div>
    <p>Desliza para recorrer tu fototeca</p>
  </header>
  <div class="reels-feed" id="reelsFeed"></div>
  <div class="reels-sentinel" id="reelsSentinel"></div>
  <div class="reels-status" id="reelsStatus"></div>
</main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lbClose">✕</button>
  <button class="lb-nav lb-prev" id="lbPrev">‹</button>
  <button class="lb-nav lb-next" id="lbNext">›</button>
  <div class="lb-stage">
    <img id="lbImage" alt="">
    <video id="lbVideo" controls playsinline hidden></video>
  </div>
  <aside class="lb-info" id="lbInfo"></aside>
</div>

<!-- Country picker modal -->
<div class="modal" id="countryModal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h3>Asignar país al álbum</h3>
      <button class="modal-x" id="countryClose">✕</button>
    </div>
    <input type="text" id="countrySearch" class="modal-search" placeholder="Busca un país…" autocomplete="off">
    <div class="country-list" id="countryList"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
